<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hotel Billing System</title>

    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #74ebd5, #9face6);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        width: 90%;
        max-width: 600px;
        background: #fff;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      h2 {
        text-align: center;
        margin-bottom: 15px;
      }

      label {
        font-weight: 600;
        display: block;
        margin-top: 10px;
      }

      input {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 8px;
        border: 1px solid #ccc;
      }

      button {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        background: linear-gradient(90deg, #6c63ff, #48c6ef);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      button:hover {
        opacity: 0.9;
      }

      .bill {
        margin-top: 20px;
        background: #f9f9ff;
        padding: 15px;
        border-radius: 10px;
        border-left: 5px solid #6c63ff;
      }

      .total {
        font-size: 22px;
        font-weight: bold;
        color: #2b2b8f;
      }

      .payment {
        margin-top: 15px;
        padding: 10px;
        background: #fffbe6;
        border-radius: 8px;
      }

      .adBox {
        display: none;
        margin-top: 10px;
        padding: 10px;
        background: #e8fff0;
        border: 2px dashed green;
        border-radius: 8px;
        text-align: center;
        font-weight: bold;
      }

      /* ===== PRINT INVOICE (A4 STYLE) ===== */
      @media print {
        body {
          background: white;
        }

        .container {
          box-shadow: none;
          width: 100%;
        }

        button,
        input,
        label,
        .payment {
          display: none !important;
        }

        .bill {
          border: none;
        }
      }

      /* Invoice Header Style */
      .invoiceHeader {
        text-align: center;
        margin-bottom: 15px;
      }

      .invoiceHeader h1 {
        margin: 0;
      }

      .invoiceBox {
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 8px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Hotel Billing System</h2>

      <label>Customer Name</label>
      <input type="text" id="name" />

      <label>Room Rent (per day)</label>
      <input type="number" id="room" />

      <label>Number of Days</label>
      <input type="number" id="days" />

      <label>Food Charges</label>
      <input type="number" id="food" />

      <label>Extra Services</label>
      <input type="number" id="extra" />

      <button onclick="calculateBill()">Generate Bill</button>

      <div class="bill" id="bill" style="display: none">
        <!-- INVOICE AREA -->
        <div class="invoiceHeader">
          <h1>HOTEL INVOICE</h1>
          <p>Thank you for staying with us</p>
        </div>

        <div class="invoiceBox">
          <p id="details"></p>
          <p class="total" id="total"></p>
        </div>

        <div class="payment">
          <button onclick="payNow()">Pay Now</button>
          <button onclick="window.print()">🖨️ Print Invoice</button>
          <p id="paymentStatus"></p>
        </div>

        <div class="adBox" id="adBox">
          🎉 Special Offer: 20% OFF next booking!
        </div>
      </div>
    </div>

    <script>
      function calculateBill() {
        let name = document.getElementById("name").value;
        let room = Number(document.getElementById("room").value);
        let days = Number(document.getElementById("days").value);
        let food = Number(document.getElementById("food").value);
        let extra = Number(document.getElementById("extra").value);

        let roomTotal = room * days;
        let subtotal = roomTotal + food + extra;
        let gst = subtotal * 0.1;
        let total = subtotal + gst;

        document.getElementById("bill").style.display = "block";

        document.getElementById("details").innerHTML = `
    <b>Name:</b> ${name}<br><br>
    Room Charges: ₹${roomTotal}<br>
    Food Charges: ₹${food}<br>
    Extra Services: ₹${extra}<br>
    GST (10%): ₹${gst.toFixed(2)}<br>
  `;

        document.getElementById("total").innerHTML =
          `TOTAL AMOUNT: ₹${total.toFixed(2)}`;

        document.getElementById("adBox").style.display = "none";
        document.getElementById("paymentStatus").innerHTML = "";
      }

      function payNow() {
        document.getElementById("paymentStatus").innerHTML =
          "Payment Successful ✅";

        document.getElementById("adBox").style.display = "block";
      }
    </script>
  </body>
</html>
