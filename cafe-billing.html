<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hotel Billing System</title>

    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #74ebd5, #9face6);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        width: 90%;
        max-width: 600px;
        background: #ffffff;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        animation: fadeIn 0.6s ease-in-out;
      }

      h2 {
        text-align: center;
        color: #333;
        margin-bottom: 20px;
      }

      label {
        margin-top: 12px;
        font-weight: 600;
        color: #444;
        display: block;
      }

      input {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 8px;
        border: 1px solid #ccc;
        outline: none;
        transition: 0.3s;
      }

      input:focus {
        border-color: #6c63ff;
        box-shadow: 0 0 5px rgba(108, 99, 255, 0.4);
      }

      button {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        background: linear-gradient(90deg, #6c63ff, #48c6ef);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        transform: scale(1.03);
        opacity: 0.9;
      }

      .bill {
        margin-top: 20px;
        background: #f9f9ff;
        padding: 15px;
        border-radius: 10px;
        border-left: 5px solid #6c63ff;
        animation: fadeIn 0.5s ease-in-out;
      }

      .total {
        font-size: 22px;
        font-weight: bold;
        color: #2b2b8f;
        margin-top: 10px;
      }

      .payment {
        margin-top: 15px;
        padding: 10px;
        background: #fffbe6;
        border-radius: 8px;
      }

      .adBox {
        display: none;
        margin-top: 15px;
        padding: 12px;
        background: #e8fff0;
        border: 2px dashed #2ecc71;
        border-radius: 10px;
        text-align: center;
        font-weight: bold;
        color: #2e7d32;
        animation: pop 0.5s ease-in-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes pop {
        0% {
          transform: scale(0.8);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Hotel Billing System</h2>

      <label>Customer Name</label>
      <input type="text" id="name" />

      <label>Room Rent (per day)</label>
      <input type="number" id="room" />

      <label>Number of Days</label>
      <input type="number" id="days" />

      <label>Food Charges</label>
      <input type="number" id="food" />

      <label>Extra Services</label>
      <input type="number" id="extra" />

      <button onclick="calculateBill()">Generate Bill</button>

      <div class="bill" id="bill" style="display: none">
        <h3>Bill Summary</h3>
        <p id="details"></p>
        <p class="total" id="total"></p>

        <div class="payment">
          <h4>Payment Section</h4>
          <button onclick="payNow()">Pay Now</button>
          <p id="paymentStatus"></p>
        </div>

        <div class="adBox" id="adBox">
          🎉 SPECIAL OFFER: Get 20% OFF on your next hotel booking!
        </div>
      </div>
    </div>

    <script>
      function calculateBill() {
        let name = document.getElementById("name").value;
        let room = Number(document.getElementById("room").value);
        let days = Number(document.getElementById("days").value);
        let food = Number(document.getElementById("food").value);
        let extra = Number(document.getElementById("extra").value);

        let roomTotal = room * days;
        let subtotal = roomTotal + food + extra;
        let gst = subtotal * 0.1;
        let total = subtotal + gst;

        document.getElementById("bill").style.display = "block";

        document.getElementById("details").innerHTML = `
          Name: ${name}<br>
          Room Charges: ₹${roomTotal}<br>
          Food Charges: ₹${food}<br>
          Extra Services: ₹${extra}<br>
          GST (10%): ₹${gst.toFixed(2)}
        `;

        document.getElementById("total").innerHTML =
          `Total Payable: ₹${total.toFixed(2)}`;

        document.getElementById("adBox").style.display = "none";
        document.getElementById("paymentStatus").innerHTML = "";
      }

      function payNow() {
        document.getElementById("paymentStatus").innerHTML =
          "Payment Successful ✅ Thank you for staying with us!";

        document.getElementById("adBox").style.display = "block";

        setTimeout(() => {
          document.getElementById("bill").style.display = "none";

          document.getElementById("name").value = "";
          document.getElementById("room").value = "";
          document.getElementById("days").value = "";
          document.getElementById("food").value = "";
          document.getElementById("extra").value = "";
        }, 4000);
      }
    </script>
  </body>
</html>
